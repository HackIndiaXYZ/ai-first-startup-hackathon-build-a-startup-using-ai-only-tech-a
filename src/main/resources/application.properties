spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dukaan_dost}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.extraction.mode=${EXTRACTION_MODE:gemini}
app.transcription.api-key=${GEMINI_API_KEY:}
app.transcription.model=${GEMINI_AUDIO_MODEL:gemini-3.1-flash-lite}
app.transcription.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
spring.ai.openai.api-key=${GEMINI_API_KEY:${OPENAI_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}}
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gemini-3.1-flash-lite}
spring.ai.openai.chat.options.temperature=0
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=250ms
spring.ai.retry.backoff.max-interval=2s
spring.ai.retry.backoff.multiplier=2
server.port=${PORT:8080}

# Owner accounts. Password-reset email needs SPRING_MAIL_HOST (+ PORT/USERNAME/PASSWORD), MAIL_FROM and APP_BASE_URL.
app.mail.from=${MAIL_FROM:}
app.base-url=${APP_BASE_URL:}
app.security.reset-token-ttl=30m
app.rate-limit.account.max-requests=10
app.rate-limit.account.window=15m
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.rate-limit.drafts.max-requests=${DRAFT_RATE_LIMIT_MAX:10}
app.rate-limit.drafts.window=60s
app.rate-limit.login.max-failures=5
app.rate-limit.login.window=15m
app.shop.name=${SHOP_NAME:}
app.payment.upi-id=${UPI_ID:}
app.profile.avatar-directory=${AVATAR_STORAGE_DIR:./data/avatars}

# Render terminates TLS and forwards the client IP; Tomcat resolves it from trusted proxies only.
server.forward-headers-strategy=native
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set SESSION_COOKIE_SECURE=true on Render (HTTPS); false keeps plain-http local development working.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
