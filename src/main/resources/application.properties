spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dukaan_dost}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.extraction.mode=${EXTRACTION_MODE:gemini}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
spring.ai.openai.api-key=${GEMINI_API_KEY:${OPENAI_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}}
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gemini-3.1-flash-lite}
spring.ai.openai.chat.options.temperature=0
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=250ms
spring.ai.retry.backoff.max-interval=2s
spring.ai.retry.backoff.multiplier=2
server.port=${PORT:8080}
