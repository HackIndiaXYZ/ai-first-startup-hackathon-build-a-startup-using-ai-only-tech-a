<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#245c4f">
    <link rel="icon" href="/logo.svg?v=2" type="image/svg+xml">
    <title>Dukaan Dost | Reset password</title>
    <link rel="stylesheet" href="/styles.css?v=12">
</head>
<body>
<main class="shell">
    <header class="hero">
        <div>
            <p class="eyebrow">DUKAAN DOST</p>
            <h1>Choose a new password</h1>
            <p class="hero-copy">This link works once.</p>
        </div>
        <img class="hero-mark" src="/logo.svg?v=2" alt="Dukaan Dost">
    </header>

    <div id="global-message" class="message" role="status" aria-live="polite" hidden></div>

    <form id="reset-form" class="card">
        <label for="password">New password (8+ characters, upper/lowercase, number and symbol)</label>
        <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
            <button class="secondary" type="button" data-toggle-password="password" aria-pressed="false">Show</button>
        </div>
        <div class="form-actions">
            <button id="submit" class="primary" type="submit">Change password</button>
        </div>
        <p class="quiet"><a href="/login.html">Back to sign in</a></p>
    </form>
</main>
<script src="/auth.js"></script>
<script src="/password-toggle.js"></script>
</body>
</html>
