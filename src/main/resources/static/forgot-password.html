<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#245c4f">
    <link rel="icon" href="/logo.svg?v=2" type="image/svg+xml">
    <title>Dukaan Dost | Forgot password</title>
    <link rel="stylesheet" href="/styles.css?v=12">
</head>
<body>
<main class="shell">
    <header class="hero">
        <div>
            <p class="eyebrow">DUKAAN DOST</p>
            <h1>Forgot password?</h1>
            <p class="hero-copy">Enter your email and we will send you a link to choose a new password.</p>
        </div>
        <img class="hero-mark" src="/logo.svg?v=2" alt="Dukaan Dost">
    </header>

    <div id="global-message" class="message" role="status" aria-live="polite" hidden></div>

    <form id="forgot-form" class="card">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <div class="form-actions">
            <button id="submit" class="primary" type="submit">Send reset link</button>
        </div>
        <p class="quiet"><a href="/login.html">Back to sign in</a></p>
    </form>
</main>
<script src="/auth.js"></script>
<script src="/password-toggle.js"></script>
</body>
</html>
