<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#245c4f">
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <title>Dukaan Dost | Sign in</title>
    <link rel="stylesheet" href="/styles.css?v=11">
</head>
<body>
<main class="shell">
    <header class="hero auth-hero">
        <div class="auth-heading">
            <img class="auth-logo" src="/logo.svg?v=2" alt="Dukaan Dost logo">
            <div>
                <p class="eyebrow">DUKAAN DOST</p>
                <h1>Sign in</h1>
                <p class="hero-copy">Sign in with your shop account to open your order desk.</p>
            </div>
        </div>
    </header>

    <div id="global-message" class="message" role="status" aria-live="polite" hidden></div>

    <form id="login-form" class="card" autocomplete="on">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="secondary" type="button" data-toggle-password="password" aria-pressed="false">Show</button>
        </div>
        <div class="form-actions">
            <button id="login-submit" class="primary" type="submit">Sign in</button>
        </div>
        <p id="google-login" class="quiet" hidden>
            <a class="secondary" href="/oauth2/authorization/google">Continue with Google</a>
        </p>
        <p class="quiet"><a href="/forgot-password.html">Forgot password?</a> · <a href="/signup.html">Create an account</a></p>
    </form>
</main>
<script src="/login.js"></script>
<script src="/password-toggle.js"></script>
</body>
</html>
